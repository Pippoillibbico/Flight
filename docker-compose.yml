services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "statement_timeout=15s"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flight}
      POSTGRES_USER: ${POSTGRES_USER:-flight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flight}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flight -d flight"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    environment:
      NODE_ENV: development
      LAUNCH_MODE: soft
      RUNTIME_PROFILE: soft-zero-cost
      CACHE_BACKEND: redis
      PORT: 3000
      POSTGRES_DB: ${POSTGRES_DB:-flight}
      POSTGRES_USER: ${POSTGRES_USER:-flight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flight}
      DATABASE_URL_SCHEME: "postgresql:"
      REDIS_URL: redis://redis:6379
      FRONTEND_ORIGIN: http://127.0.0.1:8080
      FRONTEND_URL: http://127.0.0.1:8080
      CORS_ALLOWLIST: http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:3000,http://localhost:3000
      AUTH_REQUIRE_TRUSTED_ORIGIN: "false"
      AUTH_RETURN_ACCESS_TOKEN: "false"
      EXPOSE_ERROR_DETAILS: "false"
      JWT_SECRET: dev-only-jwt-secret-change-before-production-000000
      OUTBOUND_CLICK_SECRET: dev-only-outbound-click-secret-000000
      AUDIT_LOG_HMAC_KEY: dev-only-audit-log-hmac-key-000000
      INTERNAL_INGEST_TOKEN: dev-only-internal-ingest-token-000000
      ENABLE_PROVIDER_DUFFEL: "false"
      ENABLE_PROVIDER_KIWI: "false"
      ENABLE_PROVIDER_SKYSCANNER: "false"
      FLIGHT_SCAN_ENABLED: "false"
      PROVIDER_COLLECTION_ENABLED: "false"
      OURAIRPORTS_REFRESH_CRON: "30 3 1 * *"
      OURAIRPORTS_REFRESH_TIMEZONE: Europe/Rome
      AI_ALLOW_FREE_USERS: "false"
      FREE_AI_ENABLED: "false"
      EMAIL_DRY_RUN: "true"
      BILLING_PROVIDER: stripe
      STRIPE_ALLOW_INLINE_PRICE_DATA: "false"
      ALLOW_MOCK_BILLING_UPGRADES: "false"
      RUN_STARTUP_TASKS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    command: ["sh", "-c", "export DATABASE_URL=\"$${DATABASE_URL_SCHEME}//$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}\" && node scripts/db-migrate.mjs && node server/index.js"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  pg_data:
  redis_data:
